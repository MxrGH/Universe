name: Build Universe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Build for Windows / GD 2.2091
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: Win64

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Windows-GD-2.2091
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
