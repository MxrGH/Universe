name: Build Universe

concurrency:
  group: universe-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: Win64
          - name: Android ARM64
            os: ubuntu-latest
            target: Android64
          - name: Android ARMv7
            os: ubuntu-latest
            target: Android32
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate project metadata
        run: python scripts/validate_project.py

      - name: Check Python tools
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('scripts').glob('*.py')]"
          python scripts/level_maker.py --offline --prompt "Build workflow smoke test" --output universe-level-smoke-test.json
          python scripts/export_video.py --help
          python -c "import json, pathlib; data=json.loads(pathlib.Path('universe-level-smoke-test.json').read_text()); assert data['sections']"

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: ${{ matrix.platform.target }}
          combine: true

  package:
    name: Combine into one .geode package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Set up Python for package inspection
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate universal .geode contents
        env:
          PACKAGE_DIR: ${{ steps.combine.outputs.build-output }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          packages = list(Path(os.environ["PACKAGE_DIR"]).glob("*.geode"))
          assert len(packages) == 1, f"Expected one .geode package, found {len(packages)}"
          package = packages[0]

          with ZipFile(package) as archive:
              names = set(archive.namelist())
              required = {
                  "mod.json",
                  "mxrmc.universe.dll",
                  "mxrmc.universe.android64.so",
                  "mxrmc.universe.android32.so",
                  "resources/mxrmc.universe/click.mp3",
              }
              missing = required - names
              assert not missing, f"Package is missing required entries: {sorted(missing)}"
              metadata = json.loads(archive.read("mod.json"))
              assert metadata["id"] == "mxrmc.universe", metadata.get("id")
              assert metadata["gd"]["win"] == "2.2091", metadata["gd"]
              assert metadata["gd"]["android"] == "2.2091", metadata["gd"]
          print(f"Validated {package.name}: Windows x64 + Android ARM64/ARMv7")
          PY

      - name: Upload universal .geode package
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Windows-Android-GD-2.2091
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
