name: Build Universe

concurrency:
  group: universe-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: Win64
          - name: Android ARM64
            os: ubuntu-latest
            target: Android64
          - name: Android ARMv7
            os: ubuntu-latest
            target: Android32
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate project metadata
        run: python scripts/validate_project.py

      - name: Check Python tools
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('scripts').glob('*.py')]"
          python scripts/level_maker.py --offline --prompt "Build workflow smoke test" --output universe-level-smoke-test.json

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: ${{ matrix.platform.target }}
          combine: true

  package:
    name: Combine into one .geode package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload universal .geode package
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Windows-Android-GD-2.2091
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
