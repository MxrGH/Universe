name: Build and release Universe 1

permissions:
  contents: write

concurrency:
  group: universe-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: Win64
          - name: Android ARM64
            os: ubuntu-latest
            target: Android64
          - name: Android ARMv7
            os: ubuntu-latest
            target: Android32
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate metadata, logo, and license
        run: python scripts/validate_project.py

      - name: Check Python tools
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('scripts').glob('*.py')]"
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('uni1').glob('*.py')]"
          python -m pip install "fastapi>=0.115" "pydantic>=2.8" "pytest>=8.0"
          python uni1/generate_dataset.py --count 16 --output uni1-smoke-test.jsonl
          python -c "import json, pathlib; rows=[json.loads(line) for line in pathlib.Path('uni1-smoke-test.jsonl').read_text(encoding='utf-8').splitlines()]; assert len(rows)==16; [json.loads(row['response']) for row in rows]; pathlib.Path('uni1-smoke-test.jsonl').unlink()"
          python uni1/generate_dataset.py --count 64 --output uni1-quality-test.jsonl
          python uni1/validate_dataset.py uni1-quality-test.jsonl --allow-synthetic-bootstrap
          python -m pytest uni1/test_dataset_quality.py -q
          python -c "import pathlib; pathlib.Path('uni1-quality-test.jsonl').unlink()"
          python -m unittest discover -s scripts -p "test_*.py" -v
          python -m pytest uni1/test_quota.py -q
          python -c "import json, pathlib; pathlib.Path('universe-level-smoke-test.json').write_text(json.dumps({'title':'CI smoke test','difficulty':'normal','style':'test','sections':[{'name':'Section 1','gameplay':'cube','events':[{'x':0,'y':0,'type':'block','note':'fixture'}]}]}), encoding='utf-8')"
          python scripts/level_maker.py --input universe-level-smoke-test.json --format csv --output universe-level-smoke-test.csv
          python scripts/level_maker.py --input universe-level-smoke-test.json --format markdown --output universe-level-smoke-test.md
          python scripts/export_video.py --help
          python -c "import json, pathlib; data=json.loads(pathlib.Path('universe-level-smoke-test.json').read_text()); assert data['sections'] and sum(len(s['events']) for s in data['sections']) > 0; assert pathlib.Path('universe-level-smoke-test.csv').is_file(); assert pathlib.Path('universe-level-smoke-test.md').is_file()"

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: ${{ matrix.platform.target }}
          combine: true

  package:
    name: Combine and inspect universal package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Inspect universal .geode contents
        env:
          PACKAGE_DIR: ${{ steps.combine.outputs.build-output }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          packages = list(Path(os.environ["PACKAGE_DIR"]).glob("*.geode"))
          assert len(packages) == 1, f"Expected one .geode package, found {len(packages)}"
          package = packages[0]
          with ZipFile(package) as archive:
              names = set(archive.namelist())
              required = {
                  "mod.json",
                  "mxrmc.universe.dll",
                  "mxrmc.universe.android64.so",
                  "mxrmc.universe.android32.so",
                  "resources/mxrmc.universe/click.mp3",
                  "resources/mxrmc.universe/logo.png",
              }
              missing = required - names
              assert not missing, f"Package is missing: {sorted(missing)}"
              metadata = json.loads(archive.read("mod.json"))
              assert metadata["id"] == "mxrmc.universe"
              assert metadata["name"] == "Universe 1"
              assert metadata["version"] == "v1.1.1"
              assert metadata["gd"]["win"] == "2.2091"
              assert metadata["gd"]["android"] == "2.2091"
              assert archive.read("resources/mxrmc.universe/logo.png")[:8] == b"\x89PNG\r\n\x1a\n"
          print(f"Validated {package.name}: Windows x64 + Android ARM64 + Android ARMv7 + logo")
          PY

      - name: Give the release package its stable filename
        env:
          PACKAGE_DIR: ${{ steps.combine.outputs.build-output }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          folder = Path(os.environ["PACKAGE_DIR"])
          packages = list(folder.glob("*.geode"))
          assert len(packages) == 1, f"Expected one .geode, found {len(packages)}"
          packages[0].rename(folder / "Universe-1-Snapshot-26.5.geode")
          PY

      - name: Upload verified universal package
        uses: actions/upload-artifact@v4
        with:
          name: Universe-1-Snapshot-26.5
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Android Emulator Smoke Test (runtime + package ABI)
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download verified universal package
        uses: actions/download-artifact@v4
        with:
          name: Universe-1-Snapshot-26.5
          path: package

      - name: Verify Android native library ELF architectures
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          from zipfile import ZipFile

          packages = list(Path("package").glob("*.geode"))
          assert len(packages) == 1, f"Expected one .geode package, got {len(packages)}"
          with ZipFile(packages[0]) as archive:
              expected = {
                  "mxrmc.universe.android64.so": 183,
                  "mxrmc.universe.android32.so": 40,
              }
              for name, machine in expected.items():
                  data = archive.read(name)
                  assert data[:4] == bytes.fromhex("7f454c46"), f"{name} is not ELF"
                  actual = struct.unpack_from("<H", data, 18)[0]
                  assert actual == machine, f"{name}: expected ELF machine {machine}, got {actual}"
                  print(f"{name}: ELF machine {actual} verified")
          PY

      - name: Boot Android emulator and verify runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell 'until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 2; done'
            adb shell am get-current-user
            adb shell getprop sys.boot_completed
            echo "Android API 35 emulator booted and ADB commands succeeded."

  release:
    name: Publish Universe 1 — Snapshot 26.5
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    steps:
      - name: Checkout release metadata and logo
        uses: actions/checkout@v4

      - name: Download verified universal package
        uses: actions/download-artifact@v4
        with:
          name: Universe-1-Snapshot-26.5
          path: release-assets

      - name: Publish Snapshot 26.5 prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-26.5
          target_commitish: ${{ github.sha }}
          name: Universe 1 — Snapshot 26.5
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          body: |
            # Universe 1 — Snapshot 26.5 (Final Planned Snapshot)

            Snapshot 26.5 completes the planned Universe 1 snapshot series for Geometry Dash 2.2091.

            Uni-1's AI panel is experimental and is not a working hosted feature in this snapshot: no trained adapter weights or deployed inference service are included. The editor-side draft importer currently supports cube-mode block, spike, saw, orb, and pad geometry only. The existing StartPos switcher, Noclip and Speedhack toggles, Safe Mode, hitboxes, movement trail and projection, FPS controls, Practice Mode recorder/replay, icon previews, themes, presets, keybinds, global touch sound, and circular draggable UNIV button are retained.

            One universal Geode package includes:
            - Windows x64
            - Android ARM64
            - Android ARMv7

            The package is published only after all three platform builds pass, project validation and regression tests pass, and the combined archive is inspected. CI compilation and package checks do not replace real in-game testing on physical devices.

          files: |
            release-assets/*.geode
            logo.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
